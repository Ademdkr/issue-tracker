name: CD - Continuous Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'
  NX_DAEMON: 'false'

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npm run prisma:generate -- --generator client

      - name: Lint
        run: npm run lint

      - name: Check Deployment Failure Handling
        run: npx nx run backend:deployment-check

      - name: Build Backend
        run: npx nx build backend --configuration=production

      - name: Build Frontend
        run: npx nx build frontend --configuration=production

      - name: Deploy and Verify Production Commit
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: node scripts/deploy-render.mjs
