services:
  postgres:
    extends:
      file: docker/compose.services.yml
      service: postgres
  backend:
    extends:
      file: docker/compose.services.yml
      service: backend
  frontend:
    extends:
      file: docker/compose.services.yml
      service: frontend
  pgadmin:
    extends:
      file: docker/compose.services.yml
      service: pgadmin
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
networks:
  issue-tracker-network:
    driver: bridge
