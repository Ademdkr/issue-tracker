services:
  postgres:
    image: postgres:16-alpine
    container_name: issue-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issue_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5435:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - issue-tracker-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: issue-tracker-backend
    restart: unless-stopped
    ports:
      - ${BACKEND_HOST_PORT:-3001}:3000
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeMeInProduction123!}@postgres:5432/${POSTGRES_DB:-issue_tracker_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: http://localhost
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - issue-tracker-network
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --max-time
        - "5"
        - http://localhost:3000/api/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: issue-tracker-frontend
    restart: unless-stopped
    ports:
      - ${FRONTEND_HOST_PORT:-80}:8080
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - issue-tracker-network
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --max-time
        - "5"
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: issue-tracker-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@issuetracker.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - issue-tracker-network
    depends_on:
      - postgres
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
networks:
  issue-tracker-network:
    driver: bridge
