services:
  postgres:
    extends:
      file: docker/compose.services.yml
      service: postgres
    container_name: issue-tracker-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issue_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
  pgadmin:
    extends:
      file: docker/compose.services.yml
      service: pgadmin
    container_name: issue-tracker-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@issuetracker.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    profiles:
      - tools
volumes:
  postgres_data_dev:
    driver: local
  pgadmin_data_dev:
    driver: local
networks:
  issue-tracker-network:
    driver: bridge
