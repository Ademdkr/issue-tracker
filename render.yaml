# Render Blueprint Configuration
# Infrastructure as Code for Issue Tracker Deployment
# https://render.com/docs/blueprint-spec

services:
  # Deploy hooks in GitHub Actions control releases after validation.
  # Backend API (NestJS)
  - type: web
    name: issue-tracker-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    branch: master
    autoDeployTrigger: off
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        # Use the existing PostgreSQL database. Do not provision or replace it.
        # For existing services, update this secret in the Render dashboard.
        sync: false
      - key: DIRECT_URL
        # Direct PostgreSQL connection for migrations; DATABASE_URL uses the pool.
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://issue-tracker.ademdokur.dev
      - key: CORS_ORIGINS
        value: https://issue-tracker.ademdokur.dev
      - key: THROTTLE_TTL
        value: 60000
      - key: THROTTLE_LIMIT
        value: 100

  # Frontend (Angular + Nginx)
  - type: web
    name: issue-tracker-frontend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    branch: master
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://issue-tracker-backend-23d7.onrender.com
